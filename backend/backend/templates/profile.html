{% extends 'base.html' %}
{% block title %}Profile | Quantum Portfolio Optimization{% endblock %}
{% block content %}
<div class="row g-4">
    <div class="col-12">
        <div class="glass-card p-4 rounded-4">
            <h2 class="fw-bold mb-2">Profile</h2>
            <p class="text-muted mb-0">Institutional user workspace, mandate profile, and personalization settings.</p>
        </div>
    </div>
    <div class="col-lg-4">
        <div class="glass-card p-4 rounded-4 h-100">
            <h5 class="fw-semibold mb-3">Profile Snapshot</h5>
            <div id="profileSummary"></div>
            <div id="profileFeedback" class="mt-3"></div>
        </div>
    </div>
    <div class="col-lg-4">
        <div class="glass-card p-4 rounded-4 h-100">
            <h5 class="fw-semibold mb-3">Constraints & Preferences</h5>
            <div id="profileConstraints"></div>
        </div>
    </div>
    <div class="col-lg-4">
        <div class="glass-card p-4 rounded-4 h-100">
            <h5 class="fw-semibold mb-3">Portfolio Composition</h5>
            <div id="profileAllocation"></div>
        </div>
    </div>
</div>
{% endblock %}
