<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANGUARD QUANTUM | Institutional Terminal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-terminal: #050709;
            --bg-panel: #0d1117;
            --bg-card: #12181f;
            --border-faint: #1f2937;
            --border-bright: #2d3748;
            --text-bright: #ffffff;
            --text-mid: #9ca3af;
            --text-dim: #4b5563;
            --accent-green: #00ff88;
            --accent-red: #ff3b3b;
            --accent-blue: #2dd4ff;
            --accent-amber: #ffb800;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-terminal);
            color: var(--text-mid);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            margin: 0;
            overflow-x: hidden;
        }
        .mono { font-family: 'IBM Plex Mono', monospace; }
        
        /* Top Navigation */
        .top-nav {
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-bright);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { color: var(--text-bright); font-weight: 700; letter-spacing: 1px; font-size: 16px; }
        .logo span { color: var(--accent-blue); }
        .nav-status { font-size: 11px; color: var(--text-dim); display: flex; gap: 20px; }
        .nav-status .online { color: var(--accent-green); }
        
        .container-fluid { padding: 24px; max-width: 1600px; margin: 0 auto; }
        
        /* Panels & Cards */
        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border-faint);
            border-radius: 4px;
            margin-bottom: 16px;
        }
        .panel-header {
            background: var(--bg-card);
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-faint);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .panel-body { padding: 16px; }
        
        /* Typography */
        h4 { color: var(--text-bright); font-size: 1.2rem; margin-bottom: 4px; }
        h6 { color: var(--text-bright); font-size: 0.9rem; margin-bottom: 8px; }
        
        /* Tables */
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        thead th { 
            border-bottom: 1px solid var(--border-bright); 
            font-family: 'IBM Plex Mono', monospace; 
            font-size: 10px; 
            text-transform: uppercase; 
            color: var(--text-dim); 
            font-weight: 500;
            padding: 8px 12px;
            text-align: left;
        }
        tbody tr { border-bottom: 1px solid var(--border-faint); transition: background 0.2s; }
        tbody tr:hover { background: var(--bg-card); }
        tbody td { padding: 10px 12px; color: var(--text-mid); }
        
        /* Buttons */
        .btn-exec {
            background: linear-gradient(90deg, var(--accent-blue), #1eaedb);
            color: #000;
            font-weight: 700;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-family: 'IBM Plex Mono', monospace;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-exec:hover { box-shadow: 0 0 15px rgba(45, 212, 255, 0.4); color: #000; }
        .btn-exec:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .btn-ghost {
            background: transparent;
            color: var(--text-mid);
            border: 1px solid var(--border-bright);
            padding: 6px 12px;
            border-radius: 4px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-ghost:hover { color: var(--text-bright); border-color: var(--text-mid); }
        
        /* Metrics */
        .metric-block { margin-bottom: 1.5rem; }
        .metric-label { font-size: 10px; text-transform: uppercase; color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; margin-bottom: 4px; letter-spacing: 0.5px; }
        .metric-value { font-size: 1.5rem; font-weight: 600; font-family: 'IBM Plex Mono', monospace; }
        
        .alert-quantum {
            background: rgba(45, 212, 255, 0.05);
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 16px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            display: none;
        }
        
        .badge-active { background: rgba(0, 255, 136, 0.1); color: var(--accent-green); border: 1px solid rgba(0, 255, 136, 0.3); padding: 2px 8px; border-radius: 10px; font-size: 10px; font-family: 'IBM Plex Mono', monospace; }
        
        /* Progress Bars */
        .progress-bg { background: var(--bg-card); height: 6px; border-radius: 3px; overflow: hidden; margin-bottom: 12px; }
        .progress-fill { height: 100%; border-radius: 3px; }
        
        .text-bright { color: var(--text-bright) !important; }
        .text-success { color: var(--accent-green) !important; }
        .text-danger { color: var(--accent-red) !important; }
        .text-info { color: var(--accent-blue) !important; }
        .text-warning { color: var(--accent-amber) !important; }
        .text-muted { color: var(--text-dim) !important; }

                /* Quantum Circuit Styles */
        .quantum-circuit {
            background: #050709;
            border: 1px solid var(--border-faint);
            border-radius: 4px;
            padding: 20px;
            overflow-x: auto;
        }
        .qubit-line, .coupling-line {
            display: flex;
            align-items: center;
            min-width: 800px;
            margin-bottom: 10px;
        }
        .qubit-label {
            width: 40px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            color: var(--text-bright);
            text-align: right;
            padding-right: 10px;
        }
        .qubit-label-spacer, .gate-spacer {
            width: 40px;
            display: inline-block;
        }
        .wire {
            flex-grow: 1;
            height: 2px;
            background: var(--border-bright);
        }
        .gate {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 35px;
            border-radius: 4px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            font-weight: 600;
            margin: 0 5px;
            z-index: 2;
        }
        .h-gate { background: #fff; color: #000; }
        .cost-gate { background: rgba(45, 212, 255, 0.2); border: 1px solid #2dd4ff; color: #2dd4ff; }
        .mixer-gate { background: rgba(188, 140, 255, 0.2); border: 1px solid #bc8cff; color: #bc8cff; }
        .measure-gate { background: rgba(255, 59, 59, 0.2); border: 1px solid #ff3b3b; color: #ff3b3b; }
        
        .coupling {
            width: 45px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-card);
            border: 1px solid var(--border-bright);
            border-radius: 3px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            color: #ff3b3b;
            margin: 0 5px;
            z-index: 2;
            position: relative;
            top: -15px; /* Lift to sit between qubits */
        }
        
        .circuit-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-top: 15px;
            font-size: 12px;
            color: var(--text-mid);
        }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .legend-item .dot { width: 10px; height: 10px; border-radius: 50%; }

        
    </style>
</head>
<body>
    <div class="top-nav">
        <div class="logo"><span>⚛</span> VANGUARD QUANTUM</div>
        <div class="nav-status mono">
            <span>QUBO_ENGINE: <span class="online">ONLINE</span></span>
            <span>QPU_SIM: <span class="online">ACTIVE</span></span>
            <span>DB: <span class="online">CONNECTED</span></span>
        </div>
    </div>
    <div class="container-fluid">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
