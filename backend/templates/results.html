{% extends 'base.html' %}
{% block content %}
<h2>Latest Results</h2>
<pre id="latest-results">Loading...</pre>
<script>
async function loadLatest(){
  const res = await fetch('/api/results');
  const json = await res.json();
  document.getElementById('latest-results').innerText = JSON.stringify(json, null, 2);
}
loadLatest();
</script>
{% endblock %}
